# dsh-anchor-memory 的 bundle 补丁层：把自己挂进 DSH 的插件树。
#
# 安装方式（三选一）：
#   1. 应用内「设置 → 插件 → 添加插件」，输入本地绝对路径（开发期最方便）
#   2. npm：   dsh plugin --profile <profile> add dsh-anchor-memory
#   3. GitHub：dsh plugin --profile <profile> add "github:Lucas101518/dsh-anchor-memory#<commit-sha>"
# 安装后这一行（id: dsh-anchor-memory）会进入 bundle 栈，**重启 DSH 生效**。
#
# ⚠️ 不要在 DSH 运行期间手工编辑 profile 的 cordis.patch.yml —— 若该 profile 是
#    patchReload: live，HMR 会重载，可能导致会话内工具消失 / 在途回合被杀。
#    开发期请用 dev/cordis.yml + --patch 起独立进程。
#
# 配置都走默认值（memoryDir = $DSH_HOME/memory）。需要调时在应用内插件设置里改，
# 或在本行加 config: { maxChars: 9000, inject: true, ... } —— 见 README「配置」一节。
- insert:
    - id: dsh-anchor-memory
      name: dsh-anchor-memory
